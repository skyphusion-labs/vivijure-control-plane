name: changelog

# Guards cp#147: three PRs in the v1.9.0 window shipped src/ or public/ changes with no
# CHANGELOG.md entry, each caught only by a human reading the diff at the release gate rather
# than by the pipeline. This job fails a PR that touches src/ or public/ without also touching
# CHANGELOG.md.
#
# Deliberately narrow, per cp#147:
#   - src/ and public/ only. Tests, docs, and workflow-only changes do not need an entry; a
#     check that fires on everything gets bypassed on reflex, which is worse than no check.
#   - Touch, not content. No parsing of the entry, no format enforcement. The check exists to
#     make the author STOP and decide, not to grade prose.
#   - The escape hatch is LOUD: the `no-changelog` label, so a deliberate skip is a recorded
#     decision on the PR rather than a silent one.
#
# Not part of the aviation-grade-main required-check set (ci / coverage / CodeQL); this job id
# can be renamed freely, unlike those three.
#
# THREE-DOT, NOT TWO. This job compared `git diff BASE HEAD` against a base that MOVES, so once
# another PR merged to main its files appeared in this PR changed list -- and #242 shipped three
# src/ files with no entry of its own while the check went green, because somebody else merged PR
# had touched CHANGELOG.md. Another PR entry satisfied this PR requirement. `BASE...HEAD` diffs
# from the merge base, so the job sees only what this PR did.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The logic lives in a SCRIPT, not here, so it can be driven by a test against a synthetic
      # repository -- including a fixture that reproduces the false pass this job used to produce.
      # See tests/changelog-entry-required.test.py, which runs in ci.yml.
      - name: CHANGELOG.md entry required for src/ or public/ changes
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-entry-required.py . "$BASE_SHA" "$HEAD_SHA" "$LABELS_JSON"
