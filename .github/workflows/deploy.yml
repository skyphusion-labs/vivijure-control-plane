name: Deploy control plane

# THE control-plane release path. A v* tag HERE deploys the control plane; a v* tag in
# vivijure-cf deploys the Studio panel. The tag double-duty that used to exist (one repo, two
# products, shared tag semantics) is what the cf#85 extraction killed -- do not reintroduce it.
#
# NEVER on a bare push to main. An ordinary merge, even a docs-only one, must not redeploy the
# live plane. Releases are deliberate: bump package.json + src/version.ts, then cut a SemVer tag.
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# cf#80 CLOSES INTO THIS FILE. Read this before touching the migration step:
#   The live control-plane D1 was built by hand. 0001 was applied raw, 0002 was skipped, 0003 was
#   hand-applied after the fact, and there was NO d1_migrations ledger at all -- so nothing tracked
#   the gap. That produced TWO live provision failures in one e2e burn: an AUP accept 500 on a
#   missing aup_sha256 column, and a provision death at step r2_token on "no such column:
#   r2_token_id". The ledger was reconciled truthfully on 2026-07-17. From this repo forward there
#   is NO hand-applied schema, ever. Schema reaches the live database through this job or not at all.
#
# The repo schema-guard test cannot catch this class: it checks code against migrations, never
# against the DEPLOYED database. Only this workflow does.
#
# WHY TWO JOBS, and do not collapse them back into one:
#   The dry run used to be a step that ran `exit 0`. That ends the STEP, not the JOB -- so a
#   dry_run dispatch sailed straight on into migrate + deploy, doing the exact thing it was asked
#   not to do. The guard read as safe and was not.
#   Per-step `if:` conditions would fix today and rot tomorrow: the next person to add a step after
#   the guard has to remember to repeat the condition, and forgetting is silent and destructive.
#   A separate job carries the condition ONCE, at the job, so every step inside it inherits the
#   guard by construction and a newly-added step cannot escape it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render config + report pending migrations, then STOP (no migrate, no deploy)"
        type: boolean
        default: true

permissions:
  contents: read

# Never two deploys against one live plane at once. NOT cancel-in-progress: cancelling a run
# midway through d1 migrations apply is how you get a half-migrated database with a ledger that
# disagrees with the schema, which is precisely the state cf#80 exists to end.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------------
  # PREFLIGHT -- always runs, never writes anything. Gates, renders config, and REPORTS what a
  # deploy would do. This is the entirety of a dry run.
  # ------------------------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is LOAD-BEARING here for the same reason it is in ci.yml, and it became
      # load-bearing when the config guard suite moved onto this path (cp#246).
      # scripts/changelog-released-immutable.py resolves released sections by matching `## vX.Y.Z`
      # against git TAGS, and a bare checkout is shallow with none. MEASURED: the suite reports
      # 6 failures out of 53 on a shallow tagless clone. A preflight that failed that way would be
      # red for a reason that has nothing to do with the config, which teaches whoever is on the tag
      # to ignore a red.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The gate runs again on the tag. CI already ran it on the PR, but a tag can point at ANY
      # commit, including one that never saw a PR. Deploying an unverified tree to the live plane
      # because "CI passed on main" is an assumption, not a check.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The version guard, restated against the TAG. tests/version.test.ts proves package.json and
      # src/version.ts agree with each other; this proves they agree with the thing being shipped.
      # Without it, tagging v1.1.0 on a tree that still says 1.0.0 deploys a build reporting a
      # version it is not, and every later "which version is live" answer becomes a lie.
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require(\"./package.json\").version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} -- refusing to deploy a mislabelled build"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches declared version ${pkg}."

      # THE CONFIG GUARD SUITE, ON THE DEPLOY PATH (cp#246).
      #
      # This lived only in ci.yml, so the v1.19.0 tag deployed successfully while CI failed on the
      # same commit. The product gates here are real (typecheck, tests, tag-matches-version, render,
      # pinned-release-satisfiable, and release asserting the commit is on main), so a tag never
      # deployed unchecked. What it could not do was fail for a CONFIG or LEDGER defect, which is
      # exactly the class this suite catches and the only class carrying its own controls. A control
      # that exists and is never consulted is worse than no control: it reads as coverage.
      #
      # ONE DEFINITION, TWO CALLERS. Both this and ci.yml call `npm run guards:config`; the command
      # lives in package.json so the two cannot drift into two guards wearing one name. Run in the
      # deploy's OWN job rather than gating on ci.yml's conclusion for the same SHA, because a deploy
      # that trusts a sibling workflow's verdict is trusting something it cannot see, and
      # workflow-level conclusions disagree with per-SHA check-runs.
      #
      # BEFORE the render step deliberately: these guards are negative tests OF that render, so a
      # render that is about to be wrong should be refused rather than performed and then judged.
      - name: Config render guards
        run: npm run guards:config

      - name: AUP pin gate guards
        run: npm run guards:aup

      # Render here too, even though the release job renders again: a dry run must prove the
      # Actions secrets and variables are correctly populated, and the render guards are where
      # that gets proven. See scripts/render-wrangler.sh.
      # AUP pin gate (cp#396). BEFORE the render, because a deploy whose policy label and
      # policy pointer disagree must be refused rather than performed and inspected after.
      #
      # This is the control the endpoint cannot be. GET /api/aup/current returns a sha256, but
      # it is computed at request time from the bytes it just fetched, so it agrees with
      # whatever it serves and has nothing to disagree WITH. The independent value is the sha
      # recorded in docs/legal/hosted/aup/SHA256SUMS when the version was cut.
      #
      # It exists because the failure already happened: on 2026-08-14 AUP_URL was repointed at
      # a different document while AUP_VERSION stayed 1.0.0, and the change sat staged in the
      # repository variables, invisible at runtime, waiting for the next deploy of this Worker
      # for any unrelated reason to swap the text behind four existing acceptances.
      - name: AUP pin gate
        env:
          AUP_VERSION: ${{ vars.AUP_VERSION }}
          AUP_URL: ${{ vars.AUP_URL }}
        run: bash scripts/check-aup-pin.sh

      # SHARED-POOL INVOKE-KEY SCOPE (cp#396). Refuse the deploy when the pool names an endpoint
      # the shared key cannot actually submit to.
      #
      # SHARED_RUNPOD_ENDPOINTS is a repo VARIABLE and SHARED_RUNPOD_INVOKE_KEY is a SECRET, set
      # independently and by hand. There is no RunPod API that reports a key permission set, so a
      # disagreement between the two is invisible to every other check here: the pool parses, every
      # plan key is present, provisioning succeeds, and the tenant discovers it at their FIRST
      # RENDER on whichever capability the key does not cover.
      #
      # NOT REQUIRED WHEN NO POOL IS DECLARED. An empty SHARED_RUNPOD_ENDPOINTS is a legitimate
      # value meaning this plane offers no shared tier (see src/env.ts), so forcing the gate on
      # would fail a correct deploy. It arms itself off the variable instead: declare a pool and
      # the key must be present and proven, which is exactly when the check has something to say.
      # The suite ALSO refuses a half-configured plane in every mode, so setting one half and not
      # the other cannot skip past it.
      #
      # BEFORE the render, with the other refusals: a plane that cannot serve the tier it advertises
      # should be refused rather than rendered and then judged.
      - name: Shared pool invoke-key scope
        env:
          SHARED_POOL_SCOPE_REQUIRED: ${{ vars.SHARED_RUNPOD_ENDPOINTS != '' && '1' || '0' }}
          SHARED_RUNPOD_ENDPOINTS: ${{ vars.SHARED_RUNPOD_ENDPOINTS }}
          SHARED_RUNPOD_INVOKE_KEY: ${{ secrets.SHARED_RUNPOD_INVOKE_KEY }}
        run: npx vitest run tests/shared-pool-key-scope.live.test.ts

      - name: Render wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_D1_ID: ${{ secrets.CONTROL_PLANE_D1_ID }}
          TENANT_DISPATCH_NAMESPACE: ${{ vars.TENANT_DISPATCH_NAMESPACE }}
          TENANT_MODULE_NAMESPACE: ${{ vars.TENANT_MODULE_NAMESPACE }}
          STUDIO_RELEASES_BUCKET: ${{ vars.STUDIO_RELEASES_BUCKET }}
          STUDIO_RELEASE: ${{ vars.STUDIO_RELEASE }}
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
          CONTROL_PLANE_ZONE_NAME: ${{ vars.CONTROL_PLANE_ZONE_NAME }}
          AUP_VERSION: ${{ vars.AUP_VERSION }}
          AUP_URL: ${{ vars.AUP_URL }}
          POSTERN_SEND_URL: ${{ vars.POSTERN_SEND_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
          TENANT_AI_GATEWAY_ID: ${{ vars.TENANT_AI_GATEWAY_ID }}
          # cp#270: empty means this plane offers no shared tier, which is a legitimate value
          # and is why it is in ALLOW_EMPTY rather than being a required var.
          SHARED_RUNPOD_ENDPOINTS: ${{ vars.SHARED_RUNPOD_ENDPOINTS }}
          R2_USAGE_ALERT_BYTES: ${{ vars.R2_USAGE_ALERT_BYTES }}
          TENANT_R2_STORAGE_QUOTA_BYTES: ${{ vars.TENANT_R2_STORAGE_QUOTA_BYTES }}
          TENANT_LLM_SPEND_ALLOWANCE_MICRO_USD: ${{ vars.TENANT_LLM_SPEND_ALLOWANCE_MICRO_USD }}
          TENANT_R2_STORAGE_QUOTA_MODE: ${{ vars.TENANT_R2_STORAGE_QUOTA_MODE }}
          CREDITS_ENFORCING: ${{ vars.CREDITS_ENFORCING }}
          MANUAL_CREDIT_CEILING_MICRO_USD: ${{ vars.MANUAL_CREDIT_CEILING_MICRO_USD }}
          TENANT_SPEND_DAILY_CEILING: ${{ vars.TENANT_SPEND_DAILY_CEILING }}
          STUDIO_TOKEN_KEK_ENCRYPT_SLOT: ${{ vars.STUDIO_TOKEN_KEK_ENCRYPT_SLOT }}
          SMOKE_RENDER_COOLDOWN_SECONDS: ${{ vars.SMOKE_RENDER_COOLDOWN_SECONDS }}
          SMOKE_RENDER_DAILY_CAP: ${{ vars.SMOKE_RENDER_DAILY_CAP }}
          SMOKE_RENDER_INFLIGHT_SECONDS: ${{ vars.SMOKE_RENDER_INFLIGHT_SECONDS }}
          # cp#48: keep SELFHOST-SKIP fleet blocks (tail_consumers -> vivijure-tail). Self-host
          # renders strip them by default so a dangling tail name does not fail wrangler deploy.
          KEEP_FLEET_ONLY: "1"
        run: scripts/render-wrangler.sh wrangler.toml

      # ARTIFACT-EXISTENCE GATE (cp#187). Read the step comment on "Deploy control-plane worker"
      # below: it has always ASSERTED that the studio-releases bucket "must exist AND hold the
      # artifact for the pinned STUDIO_RELEASE tag". In prose. With nothing checking it.
      # A comment is not a gate.
      #
      # THE NEAR-MISS: cp#184 added plan-enhance to TENANT_MODULE_CATALOG while STUDIO_RELEASE was
      # still pinned at v1.9.0, whose release publishes no plan-enhance bundle. That pair deploys
      # perfectly green and then fails EVERY provision at modules_upload -- loud, but every one,
      # and only once a real tenant hits it. It was caught by a human reading a diff.
      #
      # scripts/var-census.py closes the adjacent class (the config lists agreeing with each other)
      # but by construction cannot look INSIDE an artifact. This step looks inside the artifact:
      # every catalog module must have a bundle manifest naming that module, and the worker bytes
      # that manifest promises must be present and hash to the pinned sha256 -- the same checks
      # src/module-bundle-r2.ts performs at provision time, run BEFORE we deploy instead of after.
      #
      # SECOND ASSERTION, added after a LIVE outage: the v1.12.0 flip shipped a manifest whose
      # required_vars include R2_STORAGE_QUOTA_BYTES, for which TENANT_STUDIO_VAR_DISPOSITION had no
      # entry. assertDispositionCoversContract threw at provision AND upgrade, so the plane could
      # provision and upgrade NOTHING while this deploy sat green. Same shape as the module case --
      # the pinned release makes a demand the plane cannot answer -- so it is the same gate, over
      # the same fetched manifest, rather than a second gate an operator would assume was implied.
      #
      # READS THE GITHUB RELEASE, not R2. studio-release.yml calls the GitHub release the "PUBLIC
      # source of truth" and R2 a "CACHE/MIRROR only, never the source of truth", so this gates on
      # the canonical artifact. It is also credential-free, which is why the same check runs in
      # ci.yml on every PR -- the var gap above would have been caught before merge instead of
      # after deploy. An earlier version read R2 and could not run at all: this deploy token has no
      # R2 API read and never needed one, because the plane reaches releases through the
      # STUDIO_RELEASES binding. It refused every deploy without being able to say why, and a gate
      # that always refuses is a gate somebody disables.
      #
      # THE R2 MIRROR is covered here via --mirror-bucket (cp#209). As of cp#319 the same path also
      # runs on same-repo PR CI when STUDIO_RELEASES_R2_TOKEN is available, so a missing mirror is
      # no longer only catchable at the most expensive point. Deploy remains the hard fail for an
      # empty pin and for any tag that never saw a PR.
      #
      # In PREFLIGHT deliberately: a dry run exercises it, and `release` (which needs: preflight)
      # cannot run on a bad pin. A failed download reports CANNOT VERIFY with the underlying error
      # rather than reporting every module as missing and sending someone hunting the wrong problem.
      - name: Pinned release is satisfiable by this plane
        env:
          STUDIO_RELEASE: ${{ vars.STUDIO_RELEASE }}
          STUDIO_RELEASES_BUCKET: ${{ vars.STUDIO_RELEASES_BUCKET }}
          # cp#209. ACCOUNT-WIDE R2 read (it could not be bucket-scoped on the minting API path),
          # so the reach is bounded in CODE: every key is built by mirror_key(), which refuses
          # anything that could escape studio-releases/. tests/mirror-key-confinement.test.py drives
          # that refusal and runs on every PR.
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_RELEASES_R2_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STUDIO_RELEASE:-}" ]; then
            echo "::error::STUDIO_RELEASE is empty; refusing to deploy an unverifiable pin"
            exit 1
          fi
          # The mirror assertion is what the provisioner actually depends on: it reads R2, and
          # module-bundle-r2.ts has no fallback. Compared against the CANONICAL release manifest,
          # never the mirror own -- a mirror validated against the manifest beside it passes
          # happily when both are stale.
          python3 scripts/check-release-modules.py . \
            --release "$STUDIO_RELEASE" \
            --mirror-bucket "$STUDIO_RELEASES_BUCKET"

      # SATELLITE IMAGE PINS, ON THE DEPLOY PATH (cp#260 bucket 1).
      #
      # The pins in src/satellite-pins.ts point OUT of this repo, so no unit test can prove the tags
      # exist. This is the same argument deploy.yml already accepts for re-running typecheck and the
      # suite on a tag: a tag can point at ANY commit, including one that never saw a PR, and
      # "CI passed on main" is an assumption rather than a check.
      #
      # MEASURED before this step was added, because the obvious negative test is a false lead:
      #   tag "9.9.9-probe"  -> vitest FAILS, but on a FORMAT assertion (/^\d+\.\d+\.\d+$/),
      #                          not on existence. Stopping here concludes "the suite covers it".
      #   tag "1.0.99"       -> typecheck GREEN, all 1467 tests GREEN, config guards GREEN,
      #                          and check:pins RED with "does not resolve (HTTP 404)".
      # A well-formed pin at a tag nobody pushed is invisible to every other gate on this path. A
      # tenant provisioned on one gets an endpoint that cannot pull.
      #
      # Credential-free (anonymous GHCR), which is why the same command runs in ci.yml on every PR,
      # including from forks. This copy is the one that decides.
      #
      # EXIT 2 IS NOT A PASS, and that is deliberate in the script rather than an accident here: it
      # means the check could not be PERFORMED (network, auth, shape). So a GHCR outage fails this
      # deploy. That is the correct trade in a tag-gated estate -- an unreadable check is an
      # unverified pin -- but it is a real cost and should be recognised as this step, not chased as
      # a mystery.
      - name: Satellite image pins resolve at GHCR
        run: npm run check:pins

      # STUDIO PIN FRESHNESS, ON THE DEPLOY PATH (cf#372).
      #
      # The "Pinned release is satisfiable by this plane" step above proves the pin RESOLVES -- the
      # artifact exists, the manifest hashes, the mirror carries the bytes. It cannot report that
      # the pin is six releases OLD, because a stale pin is satisfiable in exactly the way a current
      # one is. Every pin gate on this path fires on an EMPTY pin (render-wrangler.sh REQUIRED_VARS,
      # the -z refusal above, deps.ts provisionerWiring) and NONE of them can fire on a STALE one.
      #
      # That gap is cf#372, and it has recurred three times: cp#259 found the pin at v1.12.0, a bump
      # took it to v1.13.0; a second bump took it to v1.20.0; it was six behind again eleven days
      # later. Two "bump it" fixes, 100% recurrence -- so the fix is a gate, not a reminder.
      #
      # WHAT THIS BUYS, and it is the mechanism rather than the alarm: a control-plane deploy now
      # REFUSES while its pin trails the latest published studio release. Advancing the pin stops
      # being a follow-up to a release and becomes a precondition of one.
      #
      # Credential-free (public GitHub API), exactly like check:pins, so it costs the deploy token
      # nothing.
      #
      # RELEASE MODE ONLY, deliberately. `--deployed` reads the LIVE Worker binding, and during a
      # deploy that binding is precisely what is about to change, so it would be red by construction
      # on every release carrying a pin bump. A check that fires on normal operation is a check
      # somebody mutes. The deployed comparison runs on its own cadence in studio-pin-drift.yml.
      #
      # EXIT 2 IS NOT A PASS here either: an unreadable freshness check is an unverified pin, and a
      # GitHub API outage failing this deploy is the correct trade in a tag-gated estate.
      - name: Studio pin is the latest published release
        env:
          STUDIO_RELEASE: ${{ vars.STUDIO_RELEASE }}
        run: npm run check:studio-pin

      # Show what a deploy WOULD do. On a clean release this prints the no-op line; anything else
      # is the cue that this tag carries schema change. Read-only: list, never apply.
      - name: Report pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list CP_DB --remote

      - name: Dry run stops here
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          {
            echo "### Dry run -- nothing was migrated or deployed"
            echo ""
            echo "Config rendered and validated, pending migrations reported above."
            echo "The \`release\` job is SKIPPED by design; confirm that in the run view."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::dry run complete -- the release job is skipped, nothing was migrated or deployed."

  # ------------------------------------------------------------------------------------------
  # RELEASE -- everything that WRITES. Guarded ONCE, at the job. A dry_run dispatch skips this
  # entire job, which is visible as SKIPPED in the run view rather than inferred from a log line.
  # ------------------------------------------------------------------------------------------
  release:
    needs: preflight
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the ancestry guard below can walk main to the built commit.
          fetch-depth: 0

      # SECURITY GATE (cp#62, fc#859): refuse to deploy a commit that is not on main.
      # The org tag ruleset enforces deletion + non_fast_forward only; nothing requires a
      # v* tag (or a workflow_dispatch ref) to point at a reviewed, merged commit. Without
      # this, `git tag v9.9.9 <unmerged-commit> && git push origin v9.9.9` -- or a
      # dry_run=false dispatch from a feature branch -- deploys unreviewed code to the live
      # plane, routing around branch protection. UNCONDITIONAL on purpose: this job ALSO runs
      # on a branch dispatch (dry_run=false), so gating on refs/tags/v* would wave a branch
      # dispatch straight past. Asserts the CHECKED-OUT commit (git rev-parse HEAD), which is
      # exactly what deploys.
      - name: Assert built commit is on main (no deploy of an unreviewed commit)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "::error::commit ${head} is not on origin/main; refusing to deploy an unreviewed commit"
            exit 1
          fi
          echo "commit ${head} is on origin/main; ancestry guard passed."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Rendered again rather than carried from preflight as an artifact. The rendered file holds
      # the account id and D1 id, and an artifact is downloadable from the run page by anyone who
      # can see the repo -- which is everyone, this repo is public. Re-rendering costs seconds.
      # AUP pin gate (cp#396). BEFORE the render, because a deploy whose policy label and
      # policy pointer disagree must be refused rather than performed and inspected after.
      #
      # This is the control the endpoint cannot be. GET /api/aup/current returns a sha256, but
      # it is computed at request time from the bytes it just fetched, so it agrees with
      # whatever it serves and has nothing to disagree WITH. The independent value is the sha
      # recorded in docs/legal/hosted/aup/SHA256SUMS when the version was cut.
      #
      # It exists because the failure already happened: on 2026-08-14 AUP_URL was repointed at
      # a different document while AUP_VERSION stayed 1.0.0, and the change sat staged in the
      # repository variables, invisible at runtime, waiting for the next deploy of this Worker
      # for any unrelated reason to swap the text behind four existing acceptances.
      - name: AUP pin gate
        env:
          AUP_VERSION: ${{ vars.AUP_VERSION }}
          AUP_URL: ${{ vars.AUP_URL }}
        run: bash scripts/check-aup-pin.sh

      - name: Render wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_D1_ID: ${{ secrets.CONTROL_PLANE_D1_ID }}
          TENANT_DISPATCH_NAMESPACE: ${{ vars.TENANT_DISPATCH_NAMESPACE }}
          TENANT_MODULE_NAMESPACE: ${{ vars.TENANT_MODULE_NAMESPACE }}
          STUDIO_RELEASES_BUCKET: ${{ vars.STUDIO_RELEASES_BUCKET }}
          STUDIO_RELEASE: ${{ vars.STUDIO_RELEASE }}
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
          CONTROL_PLANE_ZONE_NAME: ${{ vars.CONTROL_PLANE_ZONE_NAME }}
          AUP_VERSION: ${{ vars.AUP_VERSION }}
          AUP_URL: ${{ vars.AUP_URL }}
          POSTERN_SEND_URL: ${{ vars.POSTERN_SEND_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
          TENANT_AI_GATEWAY_ID: ${{ vars.TENANT_AI_GATEWAY_ID }}
          # cp#270: empty means this plane offers no shared tier, which is a legitimate value
          # and is why it is in ALLOW_EMPTY rather than being a required var.
          SHARED_RUNPOD_ENDPOINTS: ${{ vars.SHARED_RUNPOD_ENDPOINTS }}
          R2_USAGE_ALERT_BYTES: ${{ vars.R2_USAGE_ALERT_BYTES }}
          TENANT_R2_STORAGE_QUOTA_BYTES: ${{ vars.TENANT_R2_STORAGE_QUOTA_BYTES }}
          TENANT_LLM_SPEND_ALLOWANCE_MICRO_USD: ${{ vars.TENANT_LLM_SPEND_ALLOWANCE_MICRO_USD }}
          TENANT_R2_STORAGE_QUOTA_MODE: ${{ vars.TENANT_R2_STORAGE_QUOTA_MODE }}
          CREDITS_ENFORCING: ${{ vars.CREDITS_ENFORCING }}
          MANUAL_CREDIT_CEILING_MICRO_USD: ${{ vars.MANUAL_CREDIT_CEILING_MICRO_USD }}
          TENANT_SPEND_DAILY_CEILING: ${{ vars.TENANT_SPEND_DAILY_CEILING }}
          STUDIO_TOKEN_KEK_ENCRYPT_SLOT: ${{ vars.STUDIO_TOKEN_KEK_ENCRYPT_SLOT }}
          SMOKE_RENDER_COOLDOWN_SECONDS: ${{ vars.SMOKE_RENDER_COOLDOWN_SECONDS }}
          SMOKE_RENDER_DAILY_CAP: ${{ vars.SMOKE_RENDER_DAILY_CAP }}
          SMOKE_RENDER_INFLIGHT_SECONDS: ${{ vars.SMOKE_RENDER_INFLIGHT_SECONDS }}
          # cp#48: keep SELFHOST-SKIP fleet blocks (tail_consumers -> vivijure-tail). Self-host
          # renders strip them by default so a dangling tail name does not fail wrangler deploy.
          KEEP_FLEET_ONLY: "1"
        run: scripts/render-wrangler.sh wrangler.toml

      # MIGRATE BEFORE DEPLOY, deliberately. This ordering is load-bearing.
      #
      # Deploy-then-migrate leaves a window where NEW worker code is live against the OLD schema.
      # That window is not theoretical: it is exactly the cf#80 failure, where code referencing
      # aup_sha256 met a table without that column and threw a 500 on a real AUP accept.
      # Migrate-first is safe because control-plane migrations are ADDITIVE: old code tolerates a
      # column it does not know about, whereas new code cannot tolerate a missing one.
      #
      # If a migration is ever NOT additive (a drop, a rename, a narrowing), this ordering is WRONG
      # and the change needs a two-tag expand/contract instead. Do not silently reorder this step;
      # change the migration. See CONTRIBUTING.md.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Tee, do not swallow: this output is the evidence the run happened, and on the expected
          # no-op path it is the literal "No migrations to apply" the cf#85 DoD asks us to verify.
          npx wrangler d1 migrations apply CP_DB --remote 2>&1 | tee /tmp/d1-migrate.log
          if grep -q "No migrations to apply" /tmp/d1-migrate.log; then
            echo "::notice::D1 no-op path confirmed -- ledger already matches migrations/, nothing applied."
          else
            echo "::notice::D1 migrations were applied on this tag. Ledger updated; see the log above."
          fi

      # Post-migration proof. migrations apply exiting 0 means it did not error; it does NOT by
      # itself prove the ledger now agrees with the directory. This asks the database again and
      # fails the deploy if anything is still pending, so a partial apply cannot slip through as a
      # green run and reach the deploy step below.
      - name: Verify no migrations remain pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list CP_DB --remote 2>&1 | tee /tmp/d1-verify.log
          if grep -q "No migrations to apply" /tmp/d1-verify.log; then
            echo "::notice::verified -- live control-plane D1 ledger matches migrations/."
          else
            echo "::error::migrations still pending AFTER apply -- refusing to deploy the worker onto a schema that does not match this tag"
            exit 1
          fi

      # PREREQS only a real deploy can catch (typecheck never will):
      #   - the tenant dispatch namespace must EXIST, or the [[dispatch_namespaces]] binding is
      #     dangling and wrangler deploy fails outright
      #   - the studio-releases R2 bucket must exist AND hold the artifact for the pinned
      #     STUDIO_RELEASE tag, or provisioning fails honestly at wfp_upload later
      - name: Deploy control-plane worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # THE missing signal. Every other deploy check hits a JSON route; the v1.3.1
      # outage served 500 on `/` and every HTML path for three days while those JSON
      # routes stayed green. This asserts on the RENDERED front-door result (200 AND
      # text/html AND a non-trivial front-door body) so that class of regression turns
      # this release run RED instead of sitting silent. DETECTION, not prevention:
      # Workers deploys are atomic with no pre-switch slot, so a bad build is briefly
      # live; the point is the run goes red and pings us within seconds, not days.
      - name: Verify human-visited surface renders
        env:
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
        run: scripts/smoke-human-surface.sh "https://${CONTROL_PLANE_HOST}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Control-plane deploy: ${GITHUB_REF_NAME}"
            echo ""
            echo "- migrations: see the apply + verify steps above"
            echo "- worker: vivijure-control-plane"
          } >> "$GITHUB_STEP_SUMMARY"
