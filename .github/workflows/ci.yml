name: CI

# Typecheck + test on every push and PR. This workflow NEVER deploys; deploys live in
# deploy.yml and fire only on a v* tag.
#
# The job id below is `ci` ON PURPOSE: the org-level `aviation-grade-main` ruleset requires
# status check contexts named exactly `ci`, `coverage`, and `CodeQL`. Rename the job and every
# PR in this repo becomes permanently unmergeable (the required check never reports).
#
# vivijure-control-plane is PUBLIC and accepts outside PRs, so CI runs on GitHub-hosted
# ubuntu-latest (fork-safe sandbox), NOT the self-hosted fleet pool.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # NO branches filter on pull_request, deliberately: with `branches: [main]` a STACKED PR
  # (base = another branch) matches nothing and runs ZERO checks, which GitHub reports as
  # "no checks reported" -- reads as fine, means unverified.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is LOAD-BEARING, not a habit. scripts/changelog-released-immutable.py
      # resolves released sections by matching `## vX.Y.Z` headings against git TAGS, and a bare
      # checkout is shallow with no tags at all. With none present the guard found zero released
      # sections, compared nothing, and printed ok: it passed VACUOUSLY in the one place it had to
      # work. Its control caught that, and the script now refuses an empty comparison outright, but
      # the tags have to be here for the check to mean anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PR BODY GUARD (cp#246 / cp#255 fallout). Runs FIRST because it needs nothing installed and
      # because a body defect should be reported before five minutes of compute.
      #
      # In this estate merge is NOT ship: a PR never closes an issue, the lead closes it by hand
      # against artifact evidence. On 2026-08-01 two PRs closed their issues anyway, at merge, and
      # THE SENTENCES THAT FIRED WERE THE DISCLAIMERS WRITTEN TO HONOUR THAT RULE -- "Closes nothing
      # by itself; the lead closes #246..." and "...this does not close it." GitHub matches
      # `keyword #N` as a substring and ignores every surrounding word, so a denial fires exactly
      # like an assertion. cp#246 was closed at merge while its own PR body said it proved shape
      # only, and every piece of evidence that settled it arrived afterwards.
      #
      # A sweep of 112 artifacts found the rule held in all 20 COMMIT messages, where it was being
      # applied, and broke only in PR BODIES, where it was being EXPLAINED. The more carefully you
      # word the denial, the more likely it is to fire, because a careful denial names the number.
      #
      # IT LIVES IN THIS JOB ON PURPOSE. The org ruleset requires the status check named exactly
      # `ci`, so a guard in a separate workflow would report red and merge anyway. To block, it has
      # to ride this context.
      #
      # THE BODY IS PASSED THROUGH env, NEVER INTERPOLATED INTO THE SHELL. `${{ }}` expansion of a
      # PR body inside a `run:` block is a script-injection vector, and this repo is PUBLIC and
      # accepts fork PRs, so the body is attacker-controlled text by definition. That invariant is
      # unchanged below: PR_BODY is assigned via a shell variable through `env`, never spliced into
      # `${{ }}` template text.
      #
      # cp#395: `${{ github.event.pull_request.body }}` is the FROZEN event payload. `gh run rerun`
      # replays it verbatim, so a body corrected after a refusal reran against the pre-edit text
      # forever (measured on cp#393: refused on `close cf#372`, fixed via `gh pr edit`, `gh run
      # rerun --failed` refused AGAIN on the old sentence, only an unrelated push cleared it).
      # Fetching the body live via `gh pr view` at run time means any rerun sees current state, not
      # only one triggered by a new push. Needs `pull-requests: read` above for `gh pr view` to work
      # off the ambient GITHUB_TOKEN, including on fork PRs.
      - name: PR body carries no issue-linking keyword
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export PR_BODY
          python3 scripts/pr-body-guard.py

      # COMMIT MESSAGE GUARD (cp#265). Same matcher as the body guard; different surface.
      #
      # On squash merge the squash body IS the original commit message -- the PR body does not
      # land on main at all. GitHub auto-closes from what lands, so the body guard alone leaves
      # the path that actually fires ungated. Measured with a probe that could match (cp#265).
      #
      # Reuses scripts/pr-body-guard.py via scripts/commit-message-guard.py (no second matcher).
      # Zero commits in range is exit 2, never a pass. Range tips via env, never shell-interpolated
      # message text. Rides this `ci` job for the same ruleset reason as the body guard.
      - name: Commit messages carry no issue-linking keyword
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/commit-message-guard.py

      # tsc is NOT part of the vitest run, so type errors pass tests silently. This is the gate.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Tenant image pins point OUT of this repo, so no unit test can prove the tags exist. This
      # resolves every pin at GHCR by image name (anonymous, fork-safe): a pin at a tag nobody
      # pushed cannot merge. The production-parity half needs a prod key and runs at release
      # (npm run check:pins:prod), see docs/control-plane.md.
      - name: Satellite image pins resolve at GHCR
        run: npm run check:pins

      # The deploy config render is shell, so vitest never sees it. Its fail-closed guards are
      # what stand between a missing Actions secret and a deploy pointed at the wrong database,
      # so they are gated here, negative-tested, on every PR.
      #
      # ONE DEFINITION, TWO CALLERS (cp#246). This used to be `bash tests/render-wrangler.test.sh`
      # here and NOWHERE ELSE, so a v* tag deployed with this job red: the deploy path could not
      # fail for the class of defect these guards exist to catch. deploy.yml preflight now calls the
      # same npm script. Change the command in package.json, not in a workflow, or the two callers
      # drift into two guards wearing one name.
      - name: Config render guards
        run: npm run guards:config

      # The changelog job guards a PR; THIS guards the changelog job. It used to compare two-dot
      # against a moving base and pass a PR whose entry was somebody else. The fixture reproduces
      # that false pass before asserting the fix, because a guard whose fix cannot be watched
      # failing is a guard nobody has verified.
      - name: Changelog-entry guard, and the control that reproduces its old false pass
        run: python3 tests/changelog-entry-required.test.py

      # cp#358: the shared `## Unreleased` anchor made the PR queue quadratic -- every merge
      # re-conflicted every other open PR touching it. changelog.d/ fragments remove the shared
      # anchor; these two prove the fix rather than assume it. changelog-assemble.test.py drives
      # scripts/changelog-assemble.py byte-for-byte against fixtures, including the migration case
      # where a fragment and a hand-edited Unreleased body are both populated, and re-confirms
      # scripts/changelog-released-immutable.py still passes on the assembled + tagged result.
      # changelog-fragment-merge.test.py drives a REAL git merge: two PRs adding different
      # fragments merge clean, and the CONTROL -- the same two PRs editing Unreleased the old way
      # -- conflicts, so the claim is proven against the exact problem it exists to fix.
      - name: Changelog fragment assembler, byte-correct against fixtures
        run: python3 tests/changelog-assemble.test.py

      - name: Changelog fragment merge proof (the actual claim, plus its control)
        run: python3 tests/changelog-fragment-merge.test.py

      # Structural guards on deploy.yml. The dry run was once a STEP calling `exit 0`, which ends
      # the step and NOT the job, so a dry_run dispatch ran on into migrate + deploy. No code test
      # would have caught it -- the defect lived in the workflow shape. These assert every write to
      # the live plane sits inside the job carrying the dry-run condition.
      - name: Workflow structure guards
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 tests/workflow-guards.test.py

      # cp#395 structural guard: asserts ci.yml still reads the PR body LIVE (via `gh pr view`)
      # rather than the frozen event payload, and still carries the permission that read needs.
      - name: PR-body guard reads the live PR body, not the frozen event payload
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 tests/pr-body-guard-live-body-395.test.py

      # The front-door pages are classic scripts that tsc never sees and vitest never loads
      # (the suites test the pure helpers, not the DOM path). This catches a call to a function
      # nobody defines, which is a defect all three gates above pass silently. It is a heuristic
      # and says so; a clean run proves nobody deleted a function out from under its callers.
      # The cp#187 gate self-test. The gate ITSELF needs bucket credentials and therefore lives in
      # deploy.yml preflight; this proves its LOGIC on every PR, including fork PRs where no secret
      # is available, by running it against a local bucket-shaped tree. Positive and negative both:
      # a gate only ever seen to pass is not known to gate anything.
      - name: Release-module gate self-test
        run: bash tests/check-release-modules.test.sh

      # cp#209 blast-radius confinement. The mirror check at deploy runs under an ACCOUNT-WIDE R2
      # read credential that could not be bucket-scoped, so it can reach tenant buckets. This
      # asserts the gate cannot be pointed anywhere but studio-releases/. Credential-free, so it
      # runs here and on fork PRs -- the confinement is verified everywhere the code changes, not
      # only where the token exists.
      - name: Mirror-key confinement
        run: python3 tests/mirror-key-confinement.test.py

      # THE REAL GATE, on every PR. The GITHUB half is credential-free so it runs on fork PRs too.
      # The R2_STORAGE_QUOTA_BYTES disposition gap that took the plane down would have been caught
      # at THIS step, before merge, instead of at a tenant first provision.
      #
      # cp#319: THE MIRROR HALF. The provisioner reads R2 (module-bundle-r2.ts has no fallback).
      # Deploy always passes --mirror-bucket; until this step did too, a release that was perfect on
      # GitHub but never mirrored passed PR CI and failed only at deploy (or at first provision if
      # deploy were ever weakened). Same-repo PRs hold STUDIO_RELEASES_R2_TOKEN and run the same
      # mirror path the deploy gate uses. Forks and any run missing the token still get the GitHub
      # half; the notice names that the mirror was NOT checked so a green cannot be misread.
      #
      # Fork PRs may not receive repo variables. When STUDIO_RELEASE is absent this NOTICEs and
      # skips rather than failing, because failing every fork PR is how a gate gets removed. The
      # authoritative enforcement is deploy.yml preflight, which hard-fails on an empty pin, so the
      # softening is confined to the EARLY copy of the check and never to the deciding one.
      #
      # THE RESIDUAL RISK, written down rather than left for someone to rediscover: if repo
      # variables ever stop reaching PR runs, this path turns the gate into a silent no-op that
      # looks exactly like a passing gate. That is the same shape as every other failure this gate
      # exists to catch, so it does not get to hide in a skip branch. Same for the R2 token: if it
      # stops being available to PR runs, the GitHub half still runs and the notice says the
      # mirror was not checked -- that must never be edited into a silent pass.
      #
      # CHECKED, NOT ASSUMED: variables DO reach PR runs today. Verified 2026-07-27 in CI run
      # 30253531388, where this step logged `STUDIO_RELEASE: v1.12.0` and printed the real OK line
      # (all 6 catalog modules, all 20 required_vars) rather than the notice above. If you are
      # reading this because the step is suddenly silent, that is the thing to re-check first.
      - name: Pinned release is satisfiable by this plane
        env:
          STUDIO_RELEASE: ${{ vars.STUDIO_RELEASE }}
          STUDIO_RELEASES_BUCKET: ${{ vars.STUDIO_RELEASES_BUCKET }}
          # Same account-wide R2 read as deploy.yml preflight (cp#209). Blast radius bounded by
          # mirror_key() under studio-releases/; tests/mirror-key-confinement.test.py drives that.
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_RELEASES_R2_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STUDIO_RELEASE:-}" ]; then
            echo "::notice::STUDIO_RELEASE is not available (fork PR); the pin check is enforced at deploy."
            exit 0
          fi
          # Same R2 path the provisioner and deploy gate use, when the credential is present.
          # Without it (fork / missing secret) the GitHub half still runs; the notice is mandatory
          # so "green" cannot mean "mirror verified" when it was not.
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${STUDIO_RELEASES_BUCKET:-}" ]; then
            python3 scripts/check-release-modules.py . \
              --release "$STUDIO_RELEASE" \
              --mirror-bucket "$STUDIO_RELEASES_BUCKET"
          else
            echo "::notice::R2 mirror credentials not available on this run; checking the GitHub release only. Mirror is enforced on same-repo PRs with the secret and always at deploy (cp#319)."
            python3 scripts/check-release-modules.py . --release "$STUDIO_RELEASE"
          fi

      # The guard above gates a PR; THIS gates the guard. Every REFUSE fixture is a string GitHub
      # would genuinely auto-close on, including the two VERBATIM disclaimers that closed cp#246 and
      # cp#255, because a probe that is not a member of the class proves nothing about the class --
      # the lesson from a satellite-pin probe that tripped a FORMAT assertion and read as coverage.
      # Positive controls included, since a guard only ever seen refusing is indistinguishable from
      # one that refuses everything.
      - name: PR-body guard self-test
        run: python3 tests/pr-body-guard.test.py

      # cp#265: the commit-message caller. Watches range presence, empty-list refusal, and that a
      # linking keyword in a commit message is refused the same way a PR body is. The keyword class
      # itself is pinned by the body-guard self-test above; this pins the CALLER.
      - name: Commit-message guard self-test
        run: python3 tests/commit-message-guard.test.py

      - name: Resolve guard (front-door pages)
        run: npm run guard:resolve
